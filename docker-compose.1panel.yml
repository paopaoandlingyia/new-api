services:
  new-api:
    image: ${NEW_API_IMAGE:?set NEW_API_IMAGE in .env}
    pull_policy: always
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3210:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      SQL_DSN: ${SQL_DSN:?set SQL_DSN in .env}
      LOG_SQL_DSN: ${LOG_SQL_DSN:?set LOG_SQL_DSN in .env}
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?set CRYPTO_SECRET in .env}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_TRUSTED_URL: ${SITE_URL:?set SITE_URL in .env}
      TZ: Asia/Shanghai
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: new-api-node-1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - new-api-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\"[[:space:]]*:[[:space:]]*true'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      options:
        max-size: 20m
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    networks:
      - new-api-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  new-api-network:
    driver: bridge
